<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c542;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a820;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3c8c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Open Bible -->
  <g transform="translate(100, 130)">
    <!-- Left page -->
    <path d="M -40 -30 Q -45 -15 -45 0 L -45 25 Q -30 30 -15 25 L -15 0 Q -15 -15 -10 -30 Z" 
          fill="white" stroke="#8B7355" stroke-width="2"/>
    <!-- Right page -->
    <path d="M 40 -30 Q 45 -15 45 0 L 45 25 Q 30 30 15 25 L 15 0 Q 15 -15 10 -30 Z" 
          fill="white" stroke="#8B7355" stroke-width="2"/>
    <!-- Center binding -->
    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#8B7355" stroke-width="3"/>
    <line x1="-15" y1="25" x2="15" y2="25" stroke="#8B7355" stroke-width="3"/>
    
    <!-- Lines on pages -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="-40" y1="-15" x2="-20" y2="-15"/>
      <line x1="-40" y1="-5" x2="-20" y2="-5"/>
      <line x1="-40" y1="5" x2="-20" y2="5"/>
      <line x1="-40" y1="15" x2="-20" y2="15"/>
      <line x1="20" y1="-15" x2="40" y2="-15"/>
      <line x1="20" y1="-5" x2="40" y2="-5"/>
      <line x1="20" y1="5" x2="40" y2="5"/>
      <line x1="20" y1="15" x2="40" y2="15"/>
    </g>
  </g>

  <!-- Dove -->
  <g transform="translate(100, 55)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="white"/>
    <!-- Head -->
    <circle cx="10" cy="-5" r="5" fill="white"/>
    <!-- Beak -->
    <polygon points="15,-5 20,-4 15,-3" fill="#f5c542"/>
    <!-- Eye -->
    <circle cx="11" cy="-6" r="1" fill="#333"/>
    <!-- Wing left -->
    <path d="M -5 -2 Q -20 -15 -25 -5 Q -20 5 -5 5" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Wing right -->
    <path d="M 5 -2 Q 20 -15 25 -5 Q 20 5 5 5" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Tail -->
    <path d="M -12 2 L -20 -2 L -20 6 Z" fill="white"/>
  </g>

  <!-- PRM Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)">PRM</text>
</svg>
