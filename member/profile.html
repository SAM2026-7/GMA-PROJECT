<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layouts.js"></script>
    <script src="../js/api.js"></script>
    <script>
    if (!requireMember()) throw new Error('Not authorized');
    var user = getUser();
    var profile = {};

    function render() {
        var name = profile.name || user.name || user.fullName || user.email || '';
        var email = profile.email || user.email || '';
        var phone = profile.phone || user.phone || '';
        var branch = profile.branch || profile.churchBranch || user.branch || '';
        var status = profile.status || profile.membershipStatus || user.status || 'active';
        var memberSince = profile.memberSince || profile.createdAt || user.createdAt || '';
        var bio = profile.bio || profile.about || '';
        var content = '<div class="content-header"><div><h1 class="page-title">My Profile</h1></div></div>';
        content += '<div class="card" style="margin-bottom:20px"><div class="card-body" style="display:flex;align-items:center;gap:20px;padding:24px"><div class="avatar" style="width:72px;height:72px;font-size:1.5rem;background:var(--royal-blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center">' + getInitials(name) + '</div><div><h2 style="margin:0">' + escapeHtml(name) + '</h2><p class="text-muted">' + escapeHtml(email) + '</p><span class="badge ' + (status === 'active' ? 'badge-success' : '') + '">' + escapeHtml(status) + '</span>' + (memberSince ? '<p class="text-xs text-muted" style="margin-top:4px">Member since ' + escapeHtml(new Date(memberSince).toLocaleDateString()) + '</p>' : '') + '</div></div></div>';
        content += '<div class="card" style="margin-bottom:20px"><div class="card-header">Profile Information</div><div class="card-body"><form id="profileForm">' +
            '<div class="form-group"><label>Full Name</label><input type="text" id="profName" class="form-control" value="' + escapeHtml(name) + '"></div>' +
            '<div class="form-group"><label>Email</label><input type="email" id="profEmail" class="form-control" value="' + escapeHtml(email) + '" readonly></div>' +
            '<div class="form-group"><label>Phone</label><input type="tel" id="profPhone" class="form-control" value="' + escapeHtml(phone) + '"></div>' +
            '<div class="form-group"><label>Branch</label><input type="text" id="profBranch" class="form-control" value="' + escapeHtml(branch) + '"></div>' +
            '<div class="form-group"><label>Bio</label><textarea id="profBio" class="form-control" rows="4">' + escapeHtml(bio) + '</textarea></div>' +
            '<button type="submit" class="btn btn-primary">Save Changes</button></form></div></div>';
        document.getElementById('app').innerHTML = renderMemberLayout('profile', content);
        document.getElementById('sidebarToggle').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            API.members.update(user.memberId || user.id, {
                name: document.getElementById('profName').value,
                phone: document.getElementById('profPhone').value,
                branch: document.getElementById('profBranch').value,
                bio: document.getElementById('profBio').value
            }).then(function() { showToast('Profile updated', 'success'); }).catch(function() { showToast('Failed to update', 'error'); });
        });
    }
    render();
    API.members.getMe().then(function(r) {
        profile = (r && r.data) ? r.data : {};
        render();
    }).catch(function() { render(); });
    </script>
</body>
</html>
