<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Giving - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layouts.js"></script>
    <script src="../js/api.js"></script>
    <script>
    if (!requireMember()) throw new Error('Not authorized');
    var user = getUser();
    var allGiving = [];
    var categories = ['All', 'Tithe', 'Offering', 'Missions', 'Building', 'Special'];
    var currentCategory = 'All';

    function getFilteredGiving() {
        if (currentCategory === 'All') return allGiving;
        return allGiving.filter(function(g) { return g.category === currentCategory; });
    }

    function getStatusBadge(status) {
        var map = { 'completed': 'badge-success', 'confirmed': 'badge-success', 'pending': 'badge-warning', 'failed': 'badge-danger', 'refunded': 'badge-info' };
        return '<span class="badge ' + (map[(status || '').toLowerCase()] || 'badge-secondary') + '">' + escapeHtml(status || 'completed') + '</span>';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function render() {
        var filtered = getFilteredGiving();
        var totalAll = allGiving.reduce(function(s, g) { return s + (g.amount || 0); }, 0);
        var now = new Date();
        var monthlyTotal = allGiving.filter(function(g) {
            var d = new Date(g.date || g.created_at);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }).reduce(function(s, g) { return s + (g.amount || 0); }, 0);
        var yearTotal = allGiving.filter(function(g) {
            return new Date(g.date || g.created_at).getFullYear() === now.getFullYear();
        }).reduce(function(s, g) { return s + (g.amount || 0); }, 0);
        var avgGift = allGiving.length > 0 ? Math.round(totalAll / allGiving.length) : 0;

        var content = '<div class="content-header"><div><h1 class="page-title">My Giving</h1></div><div><a href="../pages/giving.html" class="btn btn-primary">Give Now</a></div></div>';
        content += '<div class="stats-grid">' +
            '<div class="stat-card"><div class="stat-icon">💰</div><div class="stat-info"><span>Total Giving</span><strong>' + formatCurrency(totalAll) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">📅</div><div class="stat-info"><span>This Month</span><strong>' + formatCurrency(monthlyTotal) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-info"><span>This Year</span><strong>' + formatCurrency(yearTotal) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">🎁</div><div class="stat-info"><span>Average per Gift</span><strong>' + formatCurrency(avgGift) + '</strong></div></div></div>';

        content += '<div class="tabs">';
        categories.forEach(function(cat) {
            content += '<button class="btn tab' + (cat === currentCategory ? ' active' : '') + '" onclick="filterCategory(\'' + cat + '\')">' + cat + '</button>';
        });
        content += '</div>';

        content += '<div style="margin-bottom:1rem;display:flex;justify-content:flex-end"><button class="btn btn-sm" onclick="exportCSV()">Export CSV</button></div>';

        if (filtered.length === 0) {
            content += '<div class="empty-state card card-body"><h3>No Giving History</h3><p>You have no giving records' + (currentCategory !== 'All' ? ' in the ' + currentCategory + ' category' : '') + '.</p><a href="../pages/giving.html" class="btn btn-primary">Make Your First Gift</a></div>';
        } else {
            content += '<div class="card"><div class="card-body" style="overflow-x:auto"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th></tr></thead><tbody>';
            filtered.forEach(function(g) {
                content += '<tr><td>' + escapeHtml(formatDate(g.date || g.created_at)) + '</td>' +
                    '<td>' + escapeHtml(g.category || '') + '</td>' +
                    '<td><strong>' + formatCurrency(g.amount || 0) + '</strong></td>' +
                    '<td>' + escapeHtml(g.method || '') + '</td>' +
                    '<td><span style="font-family:monospace;font-size:0.8rem">' + escapeHtml(g.reference || '') + '</span></td>' +
                    '<td>' + getStatusBadge(g.status) + '</td></tr>';
            });
            content += '</tbody></table></div></div>';
        }

        document.getElementById('app').innerHTML = renderMemberLayout('giving', content);
        document.getElementById('sidebarToggle').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
    }

    window.filterCategory = function(cat) { currentCategory = cat; render(); };
    window.exportCSV = function() {
        var filtered = getFilteredGiving();
        var csv = 'Date,Category,Amount,Method,Reference,Status\n';
        filtered.forEach(function(g) {
            csv += (g.date || g.created_at || '') + ',' + (g.category || '') + ',' + (g.amount || 0) + ',' + (g.method || '') + ',' + (g.reference || '') + ',' + (g.status || '') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'giving-history.csv';
        a.click(); URL.revokeObjectURL(url);
    };

    render();
    API.submissions.getAll({ type: 'giving', memberId: user.memberId || user.id }).then(function(r) {
        allGiving = (r && r.data) ? (Array.isArray(r.data) ? r.data : r.data.submissions || []) : [];
        render();
    }).catch(function() { allGiving = []; render(); });
    </script>
</body>
</html>
