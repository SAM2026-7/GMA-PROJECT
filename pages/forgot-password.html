<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index.html" class="logo">
                <span class="logo-badge">GMA</span>
                <span class="logo-text">City Complex</span>
            </a>
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
            </form>
            <div id="resetMessage" class="mt-2 text-center" style="display:none"></div>
            <p class="auth-link" style="margin-top:20px"><a href="login.html">&larr; Back to login</a></p>
        </div>
    </div>
    <script src="../js/app.js"></script>
    <script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var msg = document.getElementById('resetMessage');
        msg.style.display = 'block';
        msg.innerHTML = '<div class="alert alert-success">If an account exists with that email, a password reset link has been sent.</div>';
        document.getElementById('resetForm').reset();
    });
    </script>
</body>
</html>
