<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Request - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navContainer"></div>
    <div class="page-header">
        <div class="container">
            <h1>Prayer Request</h1>
            <p>Submit your prayer request and let our prayer team stand with you in faith.</p>
            <div class="breadcrumb"><a href="/index.html">Home</a><span>/</span><span>Prayer Request</span></div>
        </div>
    </div>
    <section class="section">
        <div class="container-sm">
            <form id="prayerForm" class="card card-body" style="max-width:680px;margin:0 auto">
                <h3 style="margin-bottom:20px;color:var(--royal-deep)">Your Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="08012345678">
                    </div>
                    <div class="form-group">
                        <label for="category">Prayer Category</label>
                        <select id="category" class="form-control" required>
                            <option value="">Select category</option>
                            <option value="Family">Family</option>
                            <option value="Career">Career</option>
                            <option value="Health">Health</option>
                            <option value="Financial">Financial</option>
                            <option value="Spiritual Growth">Spiritual Growth</option>
                            <option value="Marriage">Marriage</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200)">
                <h3 style="margin-bottom:16px;color:var(--royal-deep)">Prayer Details</h3>
                <div class="form-group">
                    <label for="request">Prayer Request</label>
                    <textarea id="request" class="form-control" rows="5" placeholder="Share your prayer request with us..." required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="urgency">Urgency Level</label>
                        <select id="urgency" class="form-control" required>
                            <option value="normal">Normal</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Visibility</label>
                        <div style="display:flex;gap:24px;padding-top:8px">
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400">
                                <input type="radio" name="visibility" value="private" checked> Private
                            </label>
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400">
                                <input type="radio" name="visibility" value="public"> Public
                            </label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Submit Prayer Request</button>
            </form>
            <div id="prayerMessage" class="mt-3" style="display:none"></div>
        </div>
    </section>
    <div id="footerContainer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/api.js"></script>
    <script>
    document.getElementById('navContainer').innerHTML = renderPublicNav('');
    loadSiteSettings().then(function() { document.getElementById('footerContainer').innerHTML = renderFooter(); });
    setupNavigation();
    var user = getUser();
    if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        if (user.phone) document.getElementById('phone').value = user.phone;
    }
    document.getElementById('prayerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var phone = document.getElementById('phone').value.trim();
        var category = document.getElementById('category').value;
        var request = document.getElementById('request').value.trim();
        var urgency = document.getElementById('urgency').value;
        var visibility = document.querySelector('input[name="visibility"]:checked').value;

        if (!name || !category || !request) {
            showToast('Please fill in all required fields.', 'error');
            return;
        }

        btn.textContent = 'Submitting...';
        btn.disabled = true;

        API.prayer.create({
            name: name,
            email: email,
            phone: phone,
            category: category,
            description: request,
            request: request,
            urgency: urgency,
            visibility: visibility,
            title: category + ' Prayer Request'
        }).then(function(r) {
            saveLocalSubmission({
                id: (r && r.data && r.data.id) ? r.data.id : 'PR-' + Date.now().toString().slice(-5),
                type: 'Prayer',
                name: name,
                email: email,
                phone: phone,
                category: category,
                request: request,
                urgency: urgency,
                visibility: visibility
            });
            var prId = (r && r.data && r.data.id) ? r.data.id : 'PR-' + Date.now().toString().slice(-5);
            document.getElementById('prayerMessage').style.display = 'block';
            document.getElementById('prayerMessage').innerHTML = '<div class="alert alert-success" style="max-width:680px;margin:0 auto"><div><strong style="font-size:1.1rem">Prayer Request Submitted!</strong><br><br>Tracking Number: <strong>#' + prId + '</strong><br><br>Thank you for sharing your prayer request with us. Our prayer team will lift your needs before the Lord and contact you soon.<br><br>"Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God." - Philippians 4:6<br><br><a href="/index.html" class="btn btn-primary btn-sm" style="margin-top:12px">Return Home</a></div></div>';
            document.getElementById('prayerForm').style.display = 'none';
        }).catch(function(err) {
            saveLocalSubmission({
                id: 'LOCAL-' + Date.now().toString().slice(-5),
                type: 'Prayer',
                name: name,
                email: email,
                phone: phone,
                category: category,
                request: request,
                urgency: urgency,
                visibility: visibility
            });
            btn.textContent = 'Submit Prayer Request';
            btn.disabled = false;
            document.getElementById('prayerMessage').style.display = 'block';
            document.getElementById('prayerMessage').innerHTML = '<div class="alert alert-warning" style="max-width:680px;margin:0 auto"><div><strong style="font-size:1.1rem">Saved Locally</strong><br><br>We could not reach the server, but your prayer request has been saved. Our prayer team will review it shortly.<br><br><small>' + escapeHtml(err.message || 'Unknown error') + '</small></div></div>';
        });
    });
    </script>
</body>
</html>
