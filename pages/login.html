<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index.html" class="logo">
                <span class="logo-badge">GMA</span>
                <span class="logo-text">City Complex</span>
            </a>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--gray-600);cursor:pointer">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="forgot-password.html" style="font-size:0.85rem">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
            </form>
            <div id="loginMessage" class="form-error mt-2 text-center" style="display:none"></div>
            <div class="auth-divider">or</div>
            <p class="auth-link">Don't have an account? <a href="register.html">Create one here</a></p>
            <p class="auth-link" style="margin-top:8px;font-size:0.8rem"><a href="/index.html">&larr; Back to website</a></p>
        </div>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script>
    try {
    localStorage.removeItem('gma_token');
    localStorage.removeItem('gma_user');
    if (isLoggedIn()) {
        var role = getRole();
        if (role === 'member') window.location.href = '/member/dashboard.html';
        else window.location.href = '/admin/dashboard.html';
    }
    var loginForm = document.getElementById('loginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var msgEl = document.getElementById('loginMessage');
            var btn = document.getElementById('loginBtn');
            msgEl.style.display = 'none';
            if (!email || !password) {
                msgEl.textContent = 'Please enter email and password.';
                msgEl.style.display = 'block';
                return;
            }
            btn.textContent = 'Signing in...';
            btn.disabled = true;
            API.auth.login(email, password).then(function(result) {
                setToken(result.data.token);
                setUser(result.data.user);
                var role = result.data.user.role;
                if (role === 'member') window.location.href = '/member/dashboard.html';
                else window.location.href = '/admin/dashboard.html';
            }).catch(function(err) {
                msgEl.textContent = (err && err.message) ? err.message : 'Invalid email or password. Please try again.';
                msgEl.style.display = 'block';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            });
        });
    }
    } catch (err) {
        var msgEl = document.getElementById('loginMessage');
        if (msgEl) {
            msgEl.textContent = 'An error occurred: ' + (err && err.message ? err.message : 'Unknown error');
            msgEl.style.display = 'block';
        }
    }
    </script>
</body>
</html>
