<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navContainer"></div>
    <div class="page-header">
        <div class="container">
            <h1>Events</h1>
            <p>Discover upcoming services, conferences, and community gatherings.</p>
            <div class="breadcrumb"><a href="/index.html">Home</a><span>/</span><span>Events</span></div>
        </div>
    </div>
    <section class="section">
        <div class="container">
            <div class="tabs" id="filterTabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="service">Services</button>
                <button class="tab" data-filter="conference">Conferences</button>
                <button class="tab" data-filter="seminar">Seminars</button>
                <button class="tab" data-filter="special">Special</button>
                <button class="tab" data-filter="outreach">Outreach</button>
            </div>
            <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px" id="eventsGrid">
                <div class="text-center text-muted text-sm" style="grid-column:1/-1;padding:40px">Loading events...</div>
            </div>
            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon">&#128197;</div>
                <h3>No Events Found</h3>
                <p>There are no events matching the selected category.</p>
            </div>
        </div>
    </section>
    <div class="modal-backdrop" id="registerModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Register for Event</h3>
                <button class="modal-close" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" class="form-control" placeholder="08012345678" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost btn-sm" onclick="closeModal('registerModal')">Cancel</button>
                <button class="btn btn-primary btn-sm" id="regSubmitBtn" onclick="submitRegistration()">Register</button>
            </div>
        </div>
    </div>
    <div id="footerContainer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/api.js"></script>
    <script>
    document.getElementById('navContainer').innerHTML = renderPublicNav('events');
    loadSiteSettings().then(function() { document.getElementById('footerContainer').innerHTML = renderFooter(); });
    setupNavigation();

    var currentFilter = 'all';
    var currentEventId = null;
    var allEvents = [];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function renderEvents(filter) {
        var grid = document.getElementById('eventsGrid');
        var empty = document.getElementById('emptyState');
        var events = allEvents.filter(function(e) {
            var cat = (e.category || '').toLowerCase();
            return filter === 'all' || cat === filter;
        });
        if (events.length === 0) {
            grid.innerHTML = '';
            grid.style.display = 'none';
            empty.style.display = 'block';
            return;
        }
        grid.style.display = '';
        empty.style.display = 'none';
        grid.innerHTML = '';
        events.forEach(function(evt) {
            var dateStr = evt.startDate || evt.date || '';
            var d = new Date(dateStr + 'T00:00:00');
            var day = d.getDate();
            var month = months[d.getMonth()];
            var cat = (evt.category || '').toLowerCase();
            var catBadge = '';
            if (cat === 'service') catBadge = '<span class="badge badge-primary">Service</span>';
            else if (cat === 'conference') catBadge = '<span class="badge badge-success">Conference</span>';
            else if (cat === 'seminar') catBadge = '<span class="badge badge-info">Seminar</span>';
            else if (cat === 'special') catBadge = '<span class="badge badge-gold">Special</span>';
            else if (cat === 'outreach') catBadge = '<span class="badge badge-warning">Outreach</span>';
            var recurringBadge = evt.recurrencePattern ? '<span class="badge badge-primary" style="margin-left:6px">Recurring</span>' : '';
            var registerBtn = evt.registrationRequired ? '<button class="btn btn-primary btn-sm" onclick="openRegister(' + evt.id + ',\'' + escapeHtml(evt.title) + '\')">Register</button>' : '';
            var timeStr = evt.startTime || evt.time || '';
            var locationStr = evt.location || 'GMA City Complex';
            grid.innerHTML += '<div class="event-card">' +
                '<div class="event-date"><div class="day">' + day + '</div><div class="month">' + escapeHtml(month) + '</div></div>' +
                '<div class="event-body"><h3>' + escapeHtml(evt.title || '') + '</h3>' +
                '<div style="margin-bottom:10px">' + catBadge + recurringBadge + '</div>' +
                '<div class="event-meta"><span>&#128197; ' + escapeHtml(dateStr) + '</span>' + (timeStr ? '<span>&#128336; ' + escapeHtml(timeStr) + '</span>' : '') + '<span>&#128205; ' + escapeHtml(locationStr) + '</span></div>' +
                '<p style="color:var(--gray-600);font-size:0.9rem;margin-bottom:16px">' + escapeHtml(evt.description || '') + '</p>' +
                '<div style="display:flex;align-items:center;gap:10px">' + registerBtn + '</div></div></div>';
        });
    }

    document.getElementById('filterTabs').addEventListener('click', function(e) {
        var btn = e.target.closest('.tab');
        if (!btn) return;
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderEvents(currentFilter);
    });

    function openRegister(id, title) {
        currentEventId = id;
        document.getElementById('modalTitle').innerHTML = 'Register for ' + escapeHtml(title);
        document.getElementById('regName').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPhone').value = '';
        var user = getUser();
        if (user) {
            document.getElementById('regName').value = user.name || '';
            document.getElementById('regEmail').value = user.email || '';
        }
        showModal('registerModal');
    }

    function submitRegistration() {
        var name = document.getElementById('regName').value.trim();
        var email = document.getElementById('regEmail').value.trim();
        var phone = document.getElementById('regPhone').value.trim();
        if (!name || !email || !phone) { showToast('Please fill in all fields.', 'error'); return; }
        closeModal('registerModal');
        showToast('Registration submitted successfully!', 'success');
    }

    API.events.getAll({}).then(function(r) {
        allEvents = (r && r.data) ? (Array.isArray(r.data) ? r.data : r.data.events || []) : [];
        renderEvents('all');
    }).catch(function() {
        allEvents = [];
        renderEvents('all');
    });
    </script>
</body>
</html>
