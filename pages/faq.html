<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequently Asked Questions - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navContainer"></div>
    <div class="page-header">
        <div class="container">
            <h1>Frequently Asked Questions</h1>
            <p>Find answers to the most common questions about our ministry.</p>
            <div class="breadcrumb"><a href="/index.html">Home</a><span>/</span><span>FAQ</span></div>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="tabs" style="justify-content:center;margin-bottom:32px;flex-wrap:wrap;gap:8px">
                <button class="tab active" data-category="all">All</button>
                <button class="tab" data-category="booking">Booking</button>
                <button class="tab" data-category="counseling">Counseling</button>
                <button class="tab" data-category="prayer">Prayer</button>
                <button class="tab" data-category="giving">Giving</button>
                <button class="tab" data-category="membership">Membership</button>
                <button class="tab" data-category="general">General</button>
            </div>
            <div id="faqList" style="max-width:800px;margin:0 auto"></div>
        </div>
    </section>

    <section class="section section-alt">
        <div class="container text-center">
            <div class="card card-body" style="max-width:600px;margin:0 auto">
                <h3 style="margin-bottom:12px;color:var(--royal-deep)">Still Have Questions?</h3>
                <p class="text-muted" style="margin-bottom:20px">Can't find the answer you're looking for? We're here to help.</p>
                <a href="/pages/contact.html" class="btn btn-primary">Contact Us</a>
            </div>
        </div>
    </section>

    <div id="footerContainer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/api.js"></script>
    <script>
    document.getElementById('navContainer').innerHTML = renderPublicNav('');
    loadPageSettings().then(function() { document.getElementById('footerContainer').innerHTML = renderFooter(); });
    setupNavigation();

    var faqs = [
        { category: 'booking', question: 'How do I book a counseling session?', answer: 'You can book a session by visiting our <a href="/pages/booking.html">Book a Session</a> page, calling our office at 08169761695, or sending a WhatsApp message to +2348169761695. Our team will confirm your appointment within 24 hours.' },
        { category: 'booking', question: 'How do I change my appointment?', answer: 'To reschedule or cancel an appointment, please contact our office at least 24 hours in advance. You can call us at 08169761695 or send an email to info@gmacitycomplex.org with your booking reference number and preferred new date.' },
        { category: 'counseling', question: 'How do I book counseling?', answer: 'Visit our <a href="/pages/booking.html">Book a Session</a> page and select "Counseling" as the service type. Choose the type of counseling you need, your preferred date, time, and format (in-person, online, or phone). Our pastoral team will reach out to confirm your session.' },
        { category: 'counseling', question: 'Is counseling confidential?', answer: 'Absolutely. All counseling sessions at GMA City Complex are strictly confidential. Your privacy is protected and nothing shared during sessions is disclosed without your explicit written consent, except in cases where there is an imminent risk of harm.' },
        { category: 'counseling', question: 'How do I contact my counselor?', answer: 'You can contact your assigned counselor through our office by calling 08169761695 or emailing info@gmacitycomplex.org. Please include your booking reference number so we can direct your message to the correct counselor.' },
        { category: 'prayer', question: 'Can I request prayer anonymously?', answer: 'Yes, you can submit a prayer request anonymously through our <a href="/pages/prayer-request.html">Prayer Request</a> page. Simply select "Private" under the visibility option and leave the name field blank or use a first name only. Your privacy is fully respected.' },
        { category: 'prayer', question: 'How does the Prayer Wall work?', answer: 'The Prayer Wall is a community space where members can share prayer requests and pray for one another. Visit the <a href="/pages/prayer-wall.html">Prayer Wall</a> page to view public requests, pray for others, and share your own requests.' },
        { category: 'giving', question: 'How do I give?', answer: 'You can give through our online giving page at <a href="/pages/programs.html">Programs & Giving</a>. We accept bank transfers, mobile payments, and other secure online methods. All giving records are kept confidential and receipts are provided for tax purposes.' },
        { category: 'membership', question: 'How do I join GMA City Complex?', answer: 'We welcome everyone to be part of our community. Attend any of our services, complete the membership form online or at the welcome desk, and attend our new members orientation class held on the first Sunday of every month.' },
        { category: 'general', question: 'What are the service times?', answer: 'Our services are held as follows: Sunday Worship at 10:00 AM and 10:30 AM, Wednesday Bible Study at 6:00 PM, and Friday Prayer Night at 7:00 PM. Special events and programs are announced on our <a href="/pages/events.html">Events</a> page.' },
        { category: 'general', question: 'How do I contact GMA City Complex?', answer: 'You can reach us by phone at 08169761695, by email at info@gmacitycomplex.org, or via WhatsApp at +2348169761695. Visit our <a href="/pages/contact.html">Contact Us</a> page for more details and office hours.' }
    ];

    var faqList = document.getElementById('faqList');

    function renderFaqs(category) {
        var filtered = category === 'all' ? faqs : faqs.filter(function(f) { return f.category === category; });
        var html = '';
        filtered.forEach(function(faq, i) {
            var id = 'faq-' + faq.category + '-' + i;
            html += '<div class="card" style="margin-bottom:12px" data-category="' + escapeHtml(faq.category) + '">';
            html += '<button class="btn faq-toggle" data-target="' + id + '" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:16px 20px;cursor:pointer;font-size:1rem;color:var(--royal-deep);font-weight:600">';
            html += escapeHtml(faq.question);
            html += '<span style="font-size:1.2rem;transition:transform 0.3s">&#9660;</span>';
            html += '</button>';
            html += '<div id="' + id + '" style="display:none;padding:0 20px 16px;color:var(--gray-600);line-height:1.7">' + faq.answer + '</div>';
            html += '</div>';
        });
        faqList.innerHTML = html;
        document.querySelectorAll('.faq-toggle').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var target = document.getElementById(this.getAttribute('data-target'));
                var arrow = this.querySelector('span');
                if (target.style.display === 'none') {
                    target.style.display = 'block';
                    arrow.innerHTML = '&#9650;';
                } else {
                    target.style.display = 'none';
                    arrow.innerHTML = '&#9660;';
                }
            });
        });
    }

    renderFaqs('all');

    document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            renderFaqs(this.getAttribute('data-category'));
        });
    });
    </script>
</body>
</html>
