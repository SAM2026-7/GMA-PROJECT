<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giving Management - Admin - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layouts.js"></script>
    <script src="../js/api.js"></script>
    <script>
    if (!requireAuth('admin')) throw new Error('Not authorized');
    var giving = [];
    var stats = {};
    var currentTab = 'all';

    var CATEGORY_TABS = [
        { id: 'all', label: 'All' },
        { id: 'Tithe', label: 'Tithe' },
        { id: 'Offering', label: 'Offering' },
        { id: 'Missions', label: 'Missions' },
        { id: 'Building Projects', label: 'Building' },
        { id: 'Special Donations', label: 'Special' }
    ];

    function getGivingStatusBadge(status) {
        var map = { recorded: 'badge-success', confirmed: 'badge-success', pledged: 'badge-warning', pending: 'badge-warning', failed: 'badge-danger' };
        return '<span class="badge ' + (map[status] || 'badge-info') + '">' + escapeHtml(status || 'recorded') + '</span>';
    }

    function getFilteredGiving() {
        if (currentTab === 'all') return giving;
        return giving.filter(function(g) { return g.category === currentTab; });
    }

    function exportCSV() {
        var filtered = getFilteredGiving();
        var rows = [['Reference', 'Date', 'Donor', 'Member', 'Category', 'Amount', 'Method', 'Status', 'Transfer Ref']];
        filtered.forEach(function(g) {
            rows.push([g.referenceRef, g.createdAt || '', g.donorName, g.memberCode || '', g.category, g.amount, g.method, g.status, g.referenceNote || '']);
        });
        var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'giving-report-' + new Date().toISOString().split('T')[0] + '.csv';
        a.click(); URL.revokeObjectURL(url);
        showToast('CSV exported successfully', 'success');
    }

    function renderContent() {
        var filtered = getFilteredGiving();
        var totalGiving = stats.totalAmount != null ? stats.totalAmount : giving.reduce(function(s, g) { return s + Number(g.amount || 0); }, 0);
        var thisMonthTotal = stats.thisMonth != null ? stats.thisMonth : 0;
        var avgGift = stats.totalCount ? Math.round(totalGiving / stats.totalCount) : 0;
        var recordCount = stats.totalCount != null ? stats.totalCount : giving.length;

        var content = '<div class="content-header"><div><h1 class="page-title">Giving Management</h1><p class="page-description">Track and manage all church giving records.</p></div><div style="display:flex;gap:8px"><button class="btn" style="background:var(--gray-100);color:var(--gray-700)" onclick="window._reloadGiving()">Refresh</button><button class="btn btn-primary" onclick="exportCSV()">Export CSV</button></div></div>';
        content += '<div class="stats-grid">' +
            '<div class="stat-card"><div class="stat-icon">💰</div><div class="stat-info"><span>Total Giving</span><strong>' + formatCurrency(totalGiving) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">📅</div><div class="stat-info"><span>This Month</span><strong>' + formatCurrency(thisMonthTotal) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-info"><span>Average Gift</span><strong>' + formatCurrency(avgGift) + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-info"><span>Records</span><strong>' + recordCount + '</strong></div></div></div>';

        content += '<div class="card"><div class="card-body">' +
            '<div class="tabs">' +
            CATEGORY_TABS.map(function(t) {
                return '<button class="tab' + (currentTab === t.id ? ' active' : '') + '" onclick="handleTab(\'' + t.id + '\')">' + t.label + '</button>';
            }).join('') + '</div>' +
            '<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr>' +
            '<th>Reference</th><th>Date</th><th>Donor</th><th>Category</th><th>Amount</th><th>Method</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        if (filtered.length === 0) {
            content += '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--gray-500)">No giving records found.</td></tr>';
        } else {
            filtered.forEach(function(g) {
                content += '<tr><td><span style="font-family:monospace;font-size:0.8rem">' + escapeHtml(g.referenceRef) + '</span></td>' +
                    '<td>' + escapeHtml((g.createdAt || '').substring(0, 10)) + '</td>' +
                    '<td>' + escapeHtml(g.donorName) + (g.memberCode ? '<br><span class="text-xs text-muted">' + escapeHtml(g.memberCode) + '</span>' : '') + '</td>' +
                    '<td><span class="badge badge-primary">' + escapeHtml(g.category || '') + '</span></td>' +
                    '<td><strong>' + formatCurrency(g.amount || 0) + '</strong></td>' +
                    '<td>' + escapeHtml(g.method || '') + '</td>' +
                    '<td>' + getGivingStatusBadge(g.status) + '</td>' +
                    '<td>' + (g.status === 'pledged'
                        ? '<button class="btn btn-sm btn-primary" onclick="confirmGift(' + g.id + ')">Confirm</button>'
                        : '<span class="text-xs text-muted">Verified</span>') +
                    '</td></tr>';
            });
        }
        content += '</tbody></table></div><div style="padding:12px 0;text-align:center;color:var(--gray-500);font-size:0.85rem">Showing ' + filtered.length + ' of ' + giving.length + ' loaded records</div></div></div>';
        return content;
    }

    function render() {
        document.getElementById('app').innerHTML = renderAdminLayout('giving', renderContent());
        document.getElementById('sidebarToggle').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
    }

    window.handleTab = function(tab) { currentTab = tab; render(); };
    window.exportCSV = exportCSV;
    window.confirmGift = function(id) {
        API.donations.update(id, { status: 'confirmed' }).then(function() {
            showToast('Giving record confirmed', 'success');
            loadGiving();
        }).catch(function() { showToast('Could not update giving record', 'error'); });
    };
    window._reloadGiving = function() { loadGiving().then(function() { showToast('Giving records refreshed', 'success'); }); };

    function loadGiving() {
        return Promise.all([
            API.donations.getAll({ limit: 100 }),
            API.donations.stats().catch(function() { return { data: {} }; })
        ]).then(function(results) {
            giving = normalizeDonations(results[0]);
            stats = (results[1] && results[1].data) ? results[1].data : {};
            render();
        }).catch(function(err) {
            giving = [];
            render();
            showToast('Could not load giving records: ' + (err && err.message ? err.message : 'request failed'), 'error');
        });
    }

    loadGiving();
    startAutoRefresh(loadGiving, 60000);
    </script>
</body>
</html>
