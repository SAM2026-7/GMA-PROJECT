<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Admin - GMA City Complex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layouts.js"></script>
    <script src="../js/api.js"></script>
    <script>
    if (!requireAuth('admin')) throw new Error('Not authorized');
    var allProjects = [];
    var editingId = null;

    function render() {
        var content = '<div class="content-header"><div><h1 class="page-title">Church Projects <span class="badge">' + allProjects.length + '</span></h1></div><div><button class="btn btn-primary" onclick="openModal(null)">+ Add Project</button></div></div>';
        if (allProjects.length === 0) content += '<div class="empty-state"><p>No projects yet.</p></div>';
        else {
            content += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px">';
            allProjects.forEach(function(p) {
                var raised = p.raised || p.amount_raised || 0;
                var target = p.target || p.target_amount || 1;
                var pct = Math.min(Math.round((raised / target) * 100), 100);
                content += '<div class="card"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px"><div><h3 style="margin:0;font-size:1.05rem">' + escapeHtml(p.title || '') + '</h3><div style="display:flex;gap:6px;margin-top:6px"><span class="badge badge-primary">' + escapeHtml(p.category || 'General') + '</span><span class="badge badge-success">' + escapeHtml(p.status || 'active') + '</span></div></div><div style="display:flex;gap:6px"><button class="btn btn-sm btn-primary" onclick="openModal(' + p.id + ')">Edit</button><button class="btn btn-sm" style="background:var(--danger-bg);color:var(--danger-dark)" onclick="deleteProject(' + p.id + ')">Delete</button></div></div>' +
                '<p style="color:var(--gray-600);font-size:0.9rem;margin-bottom:16px">' + escapeHtml(p.description || '') + '</p>' +
                '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="text-sm text-muted">' + formatCurrency(raised) + ' raised</span><span class="text-sm text-muted">Target: ' + formatCurrency(target) + '</span></div><div class="progress"><div class="progress-bar" style="width:' + pct + '%"></div></div><div style="text-align:right;margin-top:4px"><span class="text-xs" style="font-weight:700;color:var(--royal-blue)">' + pct + '%</span></div></div></div></div>';
            });
            content += '</div>';
        }
        content += '<div class="modal-backdrop" id="projectModal"><div class="modal" style="max-width:600px"><div class="modal-header"><h3 id="projModalTitle">Add Project</h3><button class="modal-close" onclick="closeModal(\'projectModal\')">&times;</button></div><div class="modal-body">' +
            '<div class="form-group"><label>Title</label><input type="text" id="prjTitle" class="form-control"></div>' +
            '<div class="form-group"><label>Description</label><textarea id="prjDesc" class="form-control" rows="3"></textarea></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="form-group"><label>Category</label><select id="prjCategory" class="form-control"><option value="Building">Building</option><option value="Missions">Missions</option><option value="Youth">Youth</option><option value="Outreach">Outreach</option><option value="General">General</option></select></div><div class="form-group"><label>Status</label><select id="prjStatus" class="form-control"><option value="active">Active</option><option value="completed">Completed</option><option value="paused">Paused</option></select></div></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="form-group"><label>Target Amount</label><input type="number" id="prjTarget" class="form-control"></div><div class="form-group"><label>Raised Amount</label><input type="number" id="prjRaised" class="form-control"></div></div>' +
            '</div><div class="modal-footer"><button class="btn btn-ghost btn-sm" onclick="closeModal(\'projectModal\')">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveProject()">Save</button></div></div></div>';
        document.getElementById('app').innerHTML = renderAdminLayout('projects', content);
        document.getElementById('sidebarToggle').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
    }

    function openModal(id) {
        editingId = id;
        if (id) {
            var p = allProjects.find(function(p) { return p.id === id; });
            document.getElementById('projModalTitle').textContent = 'Edit Project';
            document.getElementById('prjTitle').value = p.title || '';
            document.getElementById('prjDesc').value = p.description || '';
            document.getElementById('prjCategory').value = p.category || 'General';
            document.getElementById('prjStatus').value = p.status || 'active';
            document.getElementById('prjTarget').value = p.target || p.target_amount || '';
            document.getElementById('prjRaised').value = p.raised || p.amount_raised || '';
        } else {
            document.getElementById('projModalTitle').textContent = 'Add Project';
            document.getElementById('prjTitle').value = '';
            document.getElementById('prjDesc').value = '';
            document.getElementById('prjCategory').value = 'Building';
            document.getElementById('prjStatus').value = 'active';
            document.getElementById('prjTarget').value = '';
            document.getElementById('prjRaised').value = '';
        }
        showModal('projectModal');
    }

    function saveProject() {
        var data = { title: document.getElementById('prjTitle').value.trim(), description: document.getElementById('prjDesc').value.trim(), category: document.getElementById('prjCategory').value, status: document.getElementById('prjStatus').value, target: Number(document.getElementById('prjTarget').value) || 0, raised: Number(document.getElementById('prjRaised').value) || 0, target_amount: Number(document.getElementById('prjTarget').value) || 0, amount_raised: Number(document.getElementById('prjRaised').value) || 0 };
        if (!data.title) { showToast('Title required', 'error'); return; }
        var promise = editingId ? API.projects.update(editingId, data) : API.projects.create(data);
        promise.then(function() { closeModal('projectModal'); showToast(editingId ? 'Updated' : 'Created', 'success'); loadProjects(); }).catch(function() { showToast('Failed', 'error'); });
    }

    function deleteProject(id) {
        if (!confirm('Delete this project?')) return;
        API.projects.delete(id).then(function() { showToast('Deleted', 'success'); loadProjects(); }).catch(function() { showToast('Failed', 'error'); });
    }

    function loadProjects() {
        API.projects.getAll({}).then(function(r) {
            allProjects = (r && r.data) ? (Array.isArray(r.data) ? r.data : r.data.projects || []) : [];
            render();
        }).catch(function() { allProjects = []; render(); });
    }
    loadProjects();
    </script>
</body>
</html>
