<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counseling Cases - GMA City Complex Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layouts.js"></script>
    <script src="../js/api.js"></script>
    <script>
    if (!requireAuth('admin')) throw new Error('Not authorized');
    var allCases = [];
    var activeFilter = 'all';
    var editingId = null;

    function render() {
        var cases = allCases.filter(function(c) { return activeFilter === 'all' || c.status === activeFilter; });
        var activeCases = allCases.filter(function(c) { return c.status === 'active'; }).length;
        var completedCases = allCases.filter(function(c) { return c.status === 'completed'; }).length;
        var content = '<div class="content-header"><div><h1 class="page-title">Counseling Cases</h1><p class="page-description">Manage and track all counseling cases.</p></div><div><button class="btn btn-primary btn-sm" onclick="openModal()">+ New Case</button></div></div>';
        content += '<div class="stats-grid"><div class="stat-card"><div class="stat-icon">\uD83D\uDCCB</div><div class="stat-info"><span>Active Cases</span><strong>' + activeCases + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">\u2705</div><div class="stat-info"><span>Completed</span><strong>' + completedCases + '</strong></div></div>' +
            '<div class="stat-card"><div class="stat-icon">\uD83D\uDCCB</div><div class="stat-info"><span>Total</span><strong>' + allCases.length + '</strong></div></div></div>';
        content += '<div class="tabs"><button class="tab ' + (activeFilter === 'all' ? 'active' : '') + '" onclick="window._filter(\'all\')">All</button>' +
            '<button class="tab ' + (activeFilter === 'active' ? 'active' : '') + '" onclick="window._filter(\'active\')">Active</button>' +
            '<button class="tab ' + (activeFilter === 'completed' ? 'active' : '') + '" onclick="window._filter(\'completed\')">Completed</button></div>';
        content += '<div id="casesContainer">';
        if (cases.length === 0) content += '<div class="empty-state"><h3>No Cases</h3><p>No counseling cases match this filter.</p></div>';
        else cases.forEach(function(c) {
            var name = c.memberName || c.member_name || 'Member';
            var sessions = c.sessionCount || c.session_count || 0;
            var progress = c.status === 'completed' ? 100 : (sessions > 0 ? Math.min(Math.round((sessions / 6) * 100), 90) : 5);
            content += '<div class="card" style="margin-bottom:16px" data-status="' + escapeHtml(c.status) + '"><div class="card-body">' +
                '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px"><div><strong>#' + escapeHtml(String(c.id).substring(0, 8)) + '</strong> ' + getStatusBadge(c.status) + '<h3 style="margin:4px 0 0">' + escapeHtml(name) + '</h3><span class="text-muted text-sm">' + escapeHtml(c.type || c.category || 'Counseling') + '</span></div>' +
                '<div style="display:flex;gap:8px"><button class="btn btn-sm btn-primary" onclick="openModal(' + c.id + ')">Edit</button><button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="deleteCase(' + c.id + ')">Delete</button></div></div>' +
                '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);margin-bottom:12px">' +
                '<div><span class="text-xs text-muted">Counselor</span><div class="text-sm" style="font-weight:600">' + escapeHtml(c.counselor || c.counselorName || 'Unassigned') + '</div></div>' +
                '<div><span class="text-xs text-muted">Priority</span><div class="text-sm" style="font-weight:600">' + escapeHtml(c.priority || 'normal') + '</div></div>' +
                '<div><span class="text-xs text-muted">Sessions</span><div class="text-sm" style="font-weight:600">' + sessions + ' completed</div></div></div>' +
                '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="text-xs text-muted">Progress</span><span class="text-xs">' + progress + '%</span></div><div class="progress"><div class="progress-bar" style="width:' + progress + '%"></div></div></div>' +
                (c.notes ? '<div style="padding:8px 12px;background:var(--gray-50);border-radius:var(--radius)"><span class="text-xs text-muted">Notes:</span><p class="text-sm" style="margin:2px 0 0">' + escapeHtml(c.notes) + '</p></div>' : '') +
                '</div></div>';
        });
        content += '</div>';
        content += '<div class="modal-backdrop" id="caseModal"><div class="modal" style="max-width:560px"><div class="modal-header"><h3 id="caseModalTitle">New Case</h3><button class="modal-close" onclick="closeModal(\'caseModal\')">&times;</button></div><div class="modal-body">' +
            '<div class="form-group"><label>Member ID</label><input type="text" id="caseMemberId" class="form-control"></div>' +
            '<div class="form-group"><label>Category</label><select id="caseCategory" class="form-control"><option value="counseling">Counseling</option><option value="prayer">Prayer</option><option value="healing">Healing</option><option value="family">Family</option><option value="marriage">Marriage</option></select></div>' +
            '<div class="form-group"><label>Title</label><input type="text" id="caseTitle" class="form-control"></div>' +
            '<div class="form-group"><label>Counselor</label><input type="text" id="caseCounselor" class="form-control"></div>' +
            '<div class="form-group"><label>Priority</label><select id="casePriority" class="form-control"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>' +
            '<div class="form-group"><label>Notes</label><textarea id="caseNotes" class="form-control" rows="3"></textarea></div>' +
            '</div><div class="modal-footer"><button class="btn btn-ghost btn-sm" onclick="closeModal(\'caseModal\')">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveCase()">Save</button></div></div></div>';
        document.getElementById('app').innerHTML = renderAdminLayout('cases', content);
        document.getElementById('sidebarToggle').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
    }

    function openModal(id) {
        editingId = id;
        if (id) {
            var c = allCases.find(function(c) { return c.id === id; });
            document.getElementById('caseModalTitle').textContent = 'Edit Case';
            document.getElementById('caseMemberId').value = c.memberId || c.member_id || '';
            document.getElementById('caseCategory').value = c.category || 'counseling';
            document.getElementById('caseTitle').value = c.title || '';
            document.getElementById('caseCounselor').value = c.counselor || c.counselorName || '';
            document.getElementById('casePriority').value = c.priority || 'normal';
            document.getElementById('caseNotes').value = c.notes || '';
        } else {
            document.getElementById('caseModalTitle').textContent = 'New Case';
            document.getElementById('caseMemberId').value = '';
            document.getElementById('caseCategory').value = 'counseling';
            document.getElementById('caseTitle').value = '';
            document.getElementById('caseCounselor').value = '';
            document.getElementById('casePriority').value = 'normal';
            document.getElementById('caseNotes').value = '';
        }
        showModal('caseModal');
    }

    function saveCase() {
        var data = {
            member_id: document.getElementById('caseMemberId').value.trim(),
            category: document.getElementById('caseCategory').value,
            title: document.getElementById('caseTitle').value.trim(),
            assigned_counselor: document.getElementById('caseCounselor').value.trim(),
            priority: document.getElementById('casePriority').value,
            description: document.getElementById('caseNotes').value.trim()
        };
        if (!data.member_id || !data.category) { showToast('Member ID and category required', 'error'); return; }
        var promise = editingId ? API.cases.update(editingId, data) : API.cases.create(data);
        promise.then(function() { closeModal('caseModal'); showToast(editingId ? 'Case updated' : 'Case created', 'success'); logFrontendAction(editingId ? 'update' : 'create', 'case', editingId || 'new', data.title); loadCases(); }).catch(function() { showToast('Failed', 'error'); });
    }

    function deleteCase(id) {
        if (!confirm('Delete this case?')) return;
        API.cases.delete(id).then(function() { showToast('Case deleted', 'success'); logFrontendAction('delete', 'case', id, 'Case deleted'); loadCases(); }).catch(function() { showToast('Failed', 'error'); });
    }

    function loadCases() {
        API.cases.getAll({}).then(function(r) {
            allCases = (r && r.data) ? (Array.isArray(r.data) ? r.data : r.data.cases || []) : [];
            render();
        }).catch(function() { allCases = []; render(); });
    }

    window._filter = function(f) { activeFilter = f; render(); };
    render();
    loadCases();
    </script>
</body>
</html>
